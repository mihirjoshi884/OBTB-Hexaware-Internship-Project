name: OBTB GitOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma-separated services e.g. oauthService,configServer'
        required: true
        default: 'oauthService,configServer'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-services.outputs.services }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Changes (Push Only)
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            apiGateway: 'backend/OBTB-HEXAWARE/API-GATEWAY/**'
            bookingService: 'backend/OBTB-HEXAWARE/BookingService/**'
            busService: 'backend/OBTB-HEXAWARE/BusService/**'
            configServer: 'backend/OBTB-HEXAWARE/Config-Server/**'
            notificationService: 'backend/OBTB-HEXAWARE/NotificationService/**'
            oauthService: 'backend/OBTB-HEXAWARE/OauthService/**'
            transactionService: 'backend/OBTB-HEXAWARE/TransactionService/**'
            userService: 'backend/OBTB-HEXAWARE/USER-SERVICE/**'
            frontend: 'frontend/obtb-app/**'

      - name: Set Services Output
        id: set-services
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.services }}"
            JSON=$(echo "$INPUT" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip().split(',')))")
            echo "services=${JSON}" >> $GITHUB_OUTPUT
          else
            echo "services=${{ steps.filter.outputs.changes_modules }}" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Robust environment resolution that explicitly maps the directory name mapping
      - name: Resolve Service Directory Path
        id: vars
        run: |
          SERVICE="${{ matrix.service }}"
          case "$SERVICE" in
            "apiGateway")           DIR="backend/OBTB-HEXAWARE/API-GATEWAY" ;;
            "bookingService")       DIR="backend/OBTB-HEXAWARE/BookingService" ;;
            "busService")           DIR="backend/OBTB-HEXAWARE/BusService" ;;
            "configServer")         DIR="backend/OBTB-HEXAWARE/Config-Server" ;;
            "notificationService")  DIR="backend/OBTB-HEXAWARE/NotificationService" ;;
            "oauthService")         DIR="backend/OBTB-HEXAWARE/OauthService" ;;
            "transactionService")   DIR="backend/OBTB-HEXAWARE/TransactionService" ;;
            "userService")           DIR="backend/OBTB-HEXAWARE/USER-SERVICE" ;;
            "frontend")              DIR="frontend/obtb-app" ;;
            *)                       echo "Unknown service: $SERVICE"; exit 1 ;;
          esac
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Set up JDK 17 (Backend Only)
        if: ${{ matrix.service != 'frontend' }}
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Explicitly use working-directory to ensure maven executes inside the module target
      - name: Build JAR with Maven (Backend Only)
        if: ${{ matrix.service != 'frontend' }}
        working-directory: ${{ steps.vars.outputs.dir }}
        run: |
          mvn clean package -DskipTests

      - name: Set up Node with npm cache (Frontend Only)
        if: ${{ matrix.service == 'frontend' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/obtb-app/package-lock.json

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ steps.vars.outputs.dir }}
          file: ./${{ steps.vars.outputs.dir }}/${{ matrix.service == 'frontend' && 'dockerfile' || 'Dockerfile' }}
          push: true
          tags: |
            mikejuliet/obtb-hexaware-internship-project-docker:${{ matrix.service }}-${{ github.sha }}

  update-gitops:
    needs: [detect-changes, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: 'mihirjoshi884/OBTB-HEXAWARE-Internship-Project-GitOps'
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-repo

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Update Target Image Tags in Helm values.yaml
        env:
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.services }}
        run: |
          cd gitops-repo/helm/obtb
          
          echo "Debug: CHANGED_SERVICES raw value is -> $CHANGED_SERVICES"
          
          if [ -z "$CHANGED_SERVICES" ] || [ "$CHANGED_SERVICES" = "[]" ] || [ "$CHANGED_SERVICES" = "null" ]; then
            echo "No changed services parsed from upstream jobs. Skipping tag updates."
            exit 0
          fi
          
          for service in $(echo "$CHANGED_SERVICES" | jq -r '.[]?'); do
            NEW_TAG="${service}-${{ github.sha }}"
            echo "Updating Helm chart tag for services.${service}.image.tag to: ${NEW_TAG}"
            
            # Executes yq cleanly without broken nested shell strings
            SERVICE_NAME="$service" NEW_TAG_VAL="$NEW_TAG" yq -i '.services.[env(SERVICE_NAME)].image.tag = env(NEW_TAG_VAL)' values.yaml
          done

      - name: Push Updates to GitOps Repository
        run: |
          cd gitops-repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/obtb/values.yaml
          git commit -m "chore: auto-update deployment tags to match commit ${{ github.sha }} [skip ci]" || exit 0
          git config --global push.autoSetupRemote true
          git push
