<form (ngSubmit)="submit()" class="space-y-6">
    <div class="space-y-4">
        <div class="flex justify-end items-center gap-4">
            <label class="text-[10px] font-bold text-slate-500 uppercase ml-2">
                your company id is
            </label>
            <span class="px-4 py-1 bg-slate-800 border rounded-2xl border-slate-950 text-slate-400 text-xs font-mono">
                {{companyId}}
            </span>
        </div>

        <div class="form-group mb-4">
            <label for="busSelect" class="block mb-2 text-[10px] font-bold text-slate-500 uppercase ml-2">select bus from your fleet</label>
            <select
                id="busSelect"
                [(ngModel)]="selectedBusId"
                name="busSelect"
                required
                (change)="onBusSelect($event)"
                class="block w-full px-4 py-3 bg-slate-950 border border-slate-700 text-white rounded-2xl shadow-sm focus:outline-none focus:border-blue-500 transition sm:text-sm appearance-none">
                <option value="" disabled>--choose a bus--</option>
                @for (bus of buses; track bus.busId) {
                    <option [value]="bus.busId">{{bus.busName}} | {{bus.registrationNumber}}</option>
                } @empty {
                    <option disabled>No buses available</option>
                }
            </select> 
        </div>

        <div class="form-group mb-4">
            <label for="routeSelect" class="block mb-2 text-[10px] font-bold text-slate-500 uppercase ml-2">select route from global routes</label>
            <select
                id="routeSelect"
                [(ngModel)]="selectedRouteId"
                name="routeSelect"
                required
                (change)="onRouteSelect($event)"
                class="block w-full px-4 py-3 bg-slate-950 border border-slate-700 text-white rounded-2xl shadow-sm focus:outline-none focus:border-blue-500 transition sm:text-sm appearance-none">
                <option value="" disabled>--choose a route--</option>
                @for (route of routes; track route.routeId) {
                    <option [value]="route.routeId">{{route.routeName}}</option>
                } @empty {
                    <option disabled>No routes available</option>
                }
            </select> 
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="form-group">
                <label for="tripSelect" class="block mb-2 text-[10px] font-bold text-slate-500 uppercase ml-2">select trip type</label>
                <select
                    id="tripSelect"
                    [(ngModel)]="selectedTripType"
                    name="tripType"
                    required
                    (change)="onTripTypeSelect($event)"
                    class="block w-full px-4 py-3 bg-slate-950 border border-slate-700 text-white rounded-2xl shadow-sm focus:outline-none focus:border-blue-500 transition sm:text-sm appearance-none">
                    @for (type of tripTypes; track type) {
                        <option [value]="type">
                            {{ type }}{{ type === 'ONE_TIME' ? ' (Default)' : '' }}
                        </option>   
                    }
                </select> 
            </div>

            <div class="space-y-2">
                <label class="text-[10px] font-bold text-slate-500 uppercase ml-2">Base Fare (₹)</label>
                <input [(ngModel)]="baseFare" name="fare" type="number" placeholder="0.00" min="0" required
                    class="w-full bg-slate-950 border border-slate-700 rounded-2xl p-3 text-white focus:border-blue-500 outline-none transition">
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 gap-6">
        @if (selectedTripType === TripType.REGULAR) {
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase ml-2">Daily Time (Regular)</label>
                    <input [(ngModel)]="selectedRegularDepartureTime" name="regTime" type="time" required
                        (input)="onRegularDepartureTimeInput($event)"
                        (change)="onRegularDepartureTimeInput($event)"
                        class="w-full bg-slate-950 border border-slate-700 rounded-2xl p-4 text-white focus:border-blue-500 outline-none transition h-[60px]">
                </div>
                <div class="space-y-2">
                    <label for="daySelect" class="text-[10px] font-bold text-slate-500 uppercase ml-2">select day of week</label>
                    <select
                        id="daySelect"
                        [(ngModel)]="selectedDay"
                        name="daySelect"
                        required
                        (change)="onDaySelect($event)"
                        class="w-full bg-slate-950 border border-slate-700 rounded-2xl p-4 text-white shadow-sm focus:outline-none focus:border-blue-500 transition h-[60px] appearance-none">
                        @for (day of daysOfWeek; track day) {
                            <option [value]="day">{{ day }}</option>   
                        } 
                    </select> 
                </div>
            </div>
        } 
        @else {
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase ml-2">Departure Date</label>
                    <input type="date" [(ngModel)]="selectedDepartureDate" name="deptDate" required
                        (input)="onDepartureDateInput($event)"
                        (change)="onDepartureDateInput($event)"
                        class="w-full bg-slate-950 border border-slate-700 rounded-2xl p-4 text-white focus:border-blue-500 outline-none transition h-[60px]">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase ml-2">Departure Time</label>
                    <input type="time" [(ngModel)]="selectedDepartureTime" name="deptTime" required
                        (input)="onDepartureTimeInput($event)"
                        (change)="onDepartureTimeInput($event)"
                        class="w-full bg-slate-950 border border-slate-700 rounded-2xl p-4 text-white focus:border-blue-500 outline-none transition h-[60px]">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase ml-2">Arrival Date</label>
                    <input type="date" [(ngModel)]="selectedArrivalDate" name="arrDate" required
                        (input)="onArrivalDateInput($event)"
                        (change)="onArrivalDateInput($event)"
                        class="w-full bg-slate-950 border border-slate-700 rounded-2xl p-4 text-white focus:border-blue-500 outline-none transition h-[60px]">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase ml-2">Arrival Time</label>
                    <input type="time" [(ngModel)]="selectedArrivalTime" name="arrTime" required
                        (input)="onArrivalTimeInput($event)"
                        (change)="onArrivalTimeInput($event)"
                        class="w-full bg-slate-950 border border-slate-700 rounded-2xl p-4 text-white focus:border-blue-500 outline-none transition h-[60px]">
                </div>
            </div>
        }
    </div>

    <div class="flex gap-4 pt-4">
        <button type="button" (click)="onCancel.emit()" 
                class="flex-1 py-4 bg-slate-800 hover:bg-slate-700 text-white rounded-2xl font-bold uppercase tracking-widest text-xs transition">
            Discard
        </button>
        <button type="submit" [disabled]="is_submitting || !isTripFormValid()" 
                class="flex-1 py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-bold uppercase tracking-widest text-xs transition">
            <span *ngIf="!is_submitting">Deploy Blueprint</span>
            <span *ngIf="is_submitting">Processing...</span>
        </button>
    </div>
</form>
