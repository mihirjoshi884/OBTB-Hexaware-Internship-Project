<form [formGroup]="passengerForm" (ngSubmit)="onSubmit()" class="space-y-8">
  
  <div formArrayName="passengers" class="space-y-6">
    @for (passenger of passengers.controls; track $index) {
      <div [formGroupName]="$index" class="bg-slate-900/50 backdrop-blur-xl border border-white/5 rounded-2xl p-6 relative">
        
        <div class="absolute -top-3 left-6 bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full border border-blue-400">
          Seat {{ passenger.get('seatNumber')?.value }}
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-2">
          
          <div>
            <label class="text-white/40 text-xs uppercase font-bold mb-2 block">Full Name</label>
            <input type="text" formControlName="name"
              class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm"
              placeholder="Passenger Name">
          </div>

          <div>
            <label class="text-white/40 text-xs uppercase font-bold mb-2 block">Age</label>
            <input type="number" formControlName="age"
              class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm"
              placeholder="Age">
          </div>

          <div>
            <label class="text-white/40 text-xs uppercase font-bold mb-2 block">Gender</label>
            <select formControlName="gender"
              class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm">
              <option value="" disabled>Select Gender</option>
              <option value="MALE">Male</option>
              <option value="FEMALE">Female</option>
              <option value="OTHER">Other</option>
            </select>
          </div>

          <div>
            <label class="text-white/40 text-xs uppercase font-bold mb-2 block">ID Proof Type</label>
            <select formControlName="idType"
              class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm">
              <option value="" disabled>Select ID</option>
              <option value="AADHAR">Aadhar Card</option>
              <option value="PAN">PAN Card</option>
              <option value="DRIVING_LICENSE">Driving License</option>
            </select>
          </div>

          <div class="md:col-span-1">
            <label class="text-white/40 text-xs uppercase font-bold mb-2 block">ID Number</label>
            <input type="text" formControlName="idNumber"
              class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm"
              placeholder="Enter ID Number">
          </div>

          <div class="md:col-span-1">
            <label class="text-white/40 text-xs uppercase font-bold mb-2 block">Upload ID Proof</label>
            <input type="file" (change)="onFileChange($event, $index)"
              accept="image/*,.pdf"
              class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-2.5 text-white/60 text-sm file:mr-4 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-blue-600 file:text-white hover:file:bg-blue-700 transition-all cursor-pointer focus:outline-none">
          </div>
        </div>
      </div>
    }
  </div>

  <div class="bg-white/5 border border-white/10 rounded-2xl p-6 flex flex-col md:flex-row justify-between items-center gap-4">
    <p class="text-white/40 text-sm">Please review the details before proceeding.</p>
    <button type="submit" [disabled]="passengerForm.invalid || loading"
      class="w-full md:w-auto px-12 py-4 bg-emerald-600 text-white font-bold rounded-xl transition-all flex items-center gap-2 justify-center hover:bg-emerald-700 disabled:opacity-30 disabled:cursor-not-allowed">
      @if (loading) {
        <div class="w-5 h-5 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>
        <span>Processing...</span>
      } @else {
        <span>Continue to Payment</span>
      }
    </button>
  </div>
</form>
